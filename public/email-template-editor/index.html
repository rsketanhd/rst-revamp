<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Email Template Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: fixed top bar; left rail (Content / Layout / Design tabs, swaps to the selected block's settings); scrolling stage with the email canvas. */
:root{
  --bg:#f5f4f9; --surface:#ffffff; --surface-2:#faf9fd; --sunk:#f1eff6;
  --line:#e6e3ee; --line-2:#d6d1e3;
  --ink:#20163f; --ink-2:#4b4466; --muted:#857f9e;
  --accent:#2b1a5c; --accent-ink:#ffffff; --accent-soft:#eeeaf8;
  --sel:#6a4ee0; --sel-ink:#ffffff; --sel-soft:rgba(106,78,224,.09);
  --danger:#c0364a; --ok:#1f8a5b;
  --shadow:0 1px 2px rgba(32,22,63,.06),0 10px 30px rgba(32,22,63,.10);
  --ui:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13111c; --surface:#1b1828; --surface-2:#211d31; --sunk:#171523;
  --line:#2c2840; --line-2:#3b3655; --ink:#ece9f6; --ink-2:#c3bdd8; --muted:#8f89a9;
  --accent:#8b77ef; --accent-ink:#130f24; --accent-soft:#2a2448;
  --sel:#9a86f6; --sel-ink:#130f24; --sel-soft:rgba(154,134,246,.14);
  --danger:#ef6b7e; --ok:#4cc38a; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111c; --surface:#1b1828; --surface-2:#211d31; --sunk:#171523;
  --line:#2c2840; --line-2:#3b3655; --ink:#ece9f6; --ink-2:#c3bdd8; --muted:#8f89a9;
  --accent:#8b77ef; --accent-ink:#130f24; --accent-soft:#2a2448;
  --sel:#9a86f6; --sel-ink:#130f24; --sel-soft:rgba(154,134,246,.14);
  --danger:#ef6b7e; --ok:#4cc38a; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.ic{display:block;flex:none}

/* ---------- App frame ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.topbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:40}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.tb-title{min-width:0}
.t1{font-weight:600;font-size:14px;color:var(--ink)}
.t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2 .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.t2.dirty .dot{background:#d99a2b}
.tb-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;width:100%}
.tb-name-view{display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%;min-width:0;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.tb-name-view:hover{background:var(--sunk)}
.tb-name-view .tb-name-text{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(420px,52vw)}
.tb-name-view .ic{color:var(--muted);flex:none}
.tb-name-view:hover .ic{color:var(--ink)}
.tb-name-edit{display:none;width:min(420px,100%);align-items:center;gap:6px}
.tb-center.is-editing .tb-name-view{display:none}
.tb-center.is-editing .tb-name-edit{display:flex}
.tb-name-edit input{height:36px;font-size:14px;font-weight:600;text-align:center}
.tb-center .err{margin-top:2px;text-align:center}
.tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.vsep{width:1px;height:24px;background:var(--line)}
.hist{display:flex;gap:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.12);border-color:var(--accent)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn:disabled,.btn:disabled{opacity:.35;cursor:default;background:transparent}
.mini{border:0;background:none;padding:2px 0;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.mini.strong{font-weight:600}
.mini:hover{text-decoration:underline}

.workspace{display:grid;grid-template-columns:280px minmax(0,1fr) 380px;min-height:0}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.props{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.props.is-empty .props-empty{display:flex}
.props-empty{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 20px;text-align:center;color:var(--muted)}
.props-empty b{color:var(--ink-2);font-weight:600;font-size:13.5px}
.props-empty span{font-size:12.5px;line-height:1.5;max-width:220px}
.stage{overflow:auto;min-width:0;display:flex;flex-direction:column}
.stage-tabs{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px 0 24px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.stage-tab-list{display:flex;align-items:center;gap:20px;min-width:0}
.stage-tab{height:44px;border:0;background:none;padding:0;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.stage-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stage-tab:hover{color:var(--ink)}
.stage-hist{display:flex;align-items:center;gap:2px;flex:none}
.stage-inner{flex:1;overflow:auto;max-width:780px;width:100%;margin:0 auto;padding-block:28px 72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.stage-pane[hidden]{display:none!important}
.inbox-banner{display:none;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;background:rgba(217,154,43,.12);border:1px solid rgba(217,154,43,.28);color:var(--ink-2);font-size:13px;line-height:1.5}
.inbox-banner.is-on{display:flex}
.inbox-banner b{display:block;font-weight:600;color:var(--ink);margin-bottom:2px}

/* ---------- Sidebar ---------- */
.side-head{padding:16px 16px 0;border-bottom:1px solid var(--line)}
.eyebrow,.cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:20px;margin-top:8px}
.tab{height:42px;border:0;background:none;padding:0;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.side-scroll{flex:1;overflow:auto;min-height:0}
.pane{padding:16px;display:flex;flex-direction:column;gap:14px}
.side-h{font-size:12px;font-weight:600;color:var(--ink-2)}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.search{position:relative}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:32px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:80px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:500;cursor:grab;user-select:none;text-align:center;padding:4px}
.tile:hover,.lay:hover,.preset:hover{border-color:var(--sel);background:var(--sel-soft);color:var(--ink)}
.tile:active{cursor:grabbing}
.tiles-empty{grid-column:1/-1;color:var(--muted);font-size:12.5px;padding:8px 0}

.lays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lay{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:grab;user-select:none;font-size:12px;font-weight:500;color:var(--ink-2)}
.lay[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.lay-d{display:flex;gap:4px;height:30px}
.lay-d i{display:block;border-radius:4px;background:var(--accent-soft);border:1px solid var(--line-2)}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:grab;user-select:none;text-align:left}
.preset .p-ic{width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--ink-2)}
.preset b{display:block;font-size:13px;font-weight:500;color:var(--ink)}
.preset span{display:block;font-size:12px;color:var(--muted)}

/* panel (selected block) */
.panel-head{padding:10px 8px;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 6px;border:0;border-radius:8px;background:none;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer}
.back:hover{background:var(--sunk);color:var(--ink)}
.panel-title{display:flex;align-items:center;gap:12px;padding:16px 16px 4px}
.pt-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.pt-name{font-size:15px;font-weight:600}
.panel-body{padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px}
.panel-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.panel-foot .btn{flex:1}
.fgroup-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);margin-top:2px}
.fgroup-h:first-child{border-top:0;padding-top:0;margin-top:0}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.hint.boxed{margin:12px 16px 0;padding:10px 12px;background:var(--sunk);border-radius:8px;color:var(--ink-2)}

/* ---------- Form controls ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flabel label,.flabel .lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.flabel output{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=text],textarea,select{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 11px;font:400 13.5px var(--ui)}
textarea{height:auto;min-height:76px;padding:9px 11px;resize:vertical;line-height:1.5}
input[type=text]::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
.input-lg{height:44px!important;font-size:14px!important}
.color-row{display:flex;gap:8px;align-items:center}
input[type=color]{width:38px;height:38px;flex:none;padding:3px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer}
.hex{font-family:var(--mono)!important;font-size:12.5px!important}
.hex.bad{border-color:var(--danger)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;isolation:isolate;background:var(--surface)}
.seg button{flex:1;height:34px;border:0;border-radius:0;background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg.wrap{display:flex;flex-wrap:nowrap;overflow:hidden}
.seg.wrap button{flex:1 1 0;min-width:0;width:auto;border-left:0;border-top:0;border-right:1px solid var(--line-2);border-bottom:0;padding:0 4px;font-size:12px}
.seg.wrap button:last-child{border-right:0}
.chip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip-grid button{height:34px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:12px;font-weight:600}
.chip-grid button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.measure-row{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:8px}
.measure-row input[type=number]{width:100%;height:38px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 11px;font:400 13.5px var(--ui)}
.measure-row select{height:38px;border-radius:10px}
.prop-rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;isolation:isolate;background:var(--surface)}
.prop-row{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px;border-top:1px solid var(--line)}
.prop-row:first-child{border-top:0}
.prop-lab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);width:100%}
.prop-ctrl{display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0;width:100%;flex-wrap:wrap}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.help-tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);font-size:10px;font-weight:700;cursor:help;position:relative}
.help-tip[data-tip]:hover::after,.tbar button[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#2a2540;color:#fff;font:500 11px var(--ui);padding:6px 8px;border-radius:6px;white-space:nowrap;z-index:20;pointer-events:none;box-shadow:var(--shadow)}
.help-tip[data-tip]:hover::before,.tbar button[data-tip]:hover::before{content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#2a2540;z-index:20}
.prop-ctrl select,.prop-ctrl .prop-select{width:100%;height:36px;min-width:0;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 10px;font:500 13px var(--ui)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;isolation:isolate;background:var(--surface)}
.stepper button{width:28px;height:30px;border:0;border-radius:0;background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;line-height:1}
.stepper .step-val{min-width:40px;text-align:center;font:500 12.5px var(--ui);font-variant-numeric:tabular-nums;color:var(--ink)}
.unit-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;isolation:isolate;background:var(--surface)}
.unit-seg button{height:30px;padding:0 10px;border:0;border-radius:0;background:var(--surface);color:var(--ink-2);font:600 11.5px var(--ui);cursor:pointer}
.unit-seg button+button{border-left:1px solid var(--line-2)}
.unit-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.tbar{display:inline-flex;align-items:center;gap:0;flex-wrap:wrap;justify-content:flex-start;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;isolation:isolate;background:var(--surface)}
.tbar button{position:relative;width:30px;height:30px;border:0;border-radius:0;border-right:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;font:700 12px var(--ui);display:inline-flex;align-items:center;justify-content:center}
.tbar button:last-child{border-right:0}
.stepper button:hover,.tbar button:hover{background:var(--sunk);color:var(--ink)}
.tbar button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.tbar .i{font-style:italic;font-weight:600}
.tbar .u{text-decoration:underline}
.tbar .s{text-decoration:line-through}
.swatch-hex{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:92px;height:30px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);font:600 11.5px var(--mono);cursor:pointer;color:#fff;overflow:hidden}
.switch-row{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-2);position:relative}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px}
.switch{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch-row input:checked+.switch{background:var(--accent)}
.switch-row input:checked+.switch::after{transform:translateX(14px)}
.switch-row input:focus-visible+.switch{outline:2px solid var(--sel);outline-offset:2px}
.img-field{display:flex;gap:10px;align-items:center}
.img-field .thumb{width:64px;height:48px;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:var(--sunk);flex:none}
.img-field .thumb-empty{width:64px;height:48px;border-radius:6px;border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--muted);flex:none}
.img-field .acts{display:flex;gap:6px;flex-wrap:wrap}
.err{font-size:12px;color:var(--danger)}
.has-err input{border-color:var(--danger)!important}

/* ---------- Stage cards ---------- */
.top-field .cap{margin-bottom:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(32,22,63,.04)}
.card-h{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:12px 12px 0 0}
.card-b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:16px}
.frow-meta{display:flex;justify-content:space-between;gap:8px;min-height:16px}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.count.warn{color:#b8730f}
.inbox-row{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.inbox-cap{font-size:11.5px;color:var(--muted);margin:-6px 0 -8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:600}
.ir-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.ir-top b{font-weight:600}
.ir-top span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ir-sub{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sec-bar{position:absolute;right:100%;top:0;padding-right:8px;display:none;flex-direction:column;gap:4px;z-index:6}

#pop{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:240px;max-width:min(320px,calc(100vw - 16px));max-height:min(360px,calc(100vh - 24px));overflow:auto}

.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)}

.m-body{padding:18px 20px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}

.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
#exportCode{font-family:var(--mono);font-size:11.5px;line-height:1.5;min-height:300px;white-space:pre;background:var(--surface-2)}
.warnbox{padding:10px 12px;border-radius:8px;background:rgba(217,154,43,.12);color:var(--ink-2);font-size:12.5px;line-height:1.5}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

function makeModule(type){return {id:uid(),type,props:MODS[type].make(state.styles)};}
function makeSection(cols){return {id:uid(),layout:[...cols],bg:'',padTop:8,padBottom:8,stack:true,columns:cols.map(()=>({id:uid(),modules:[]}))};}
function cloneWithIds(obj){const c=JSON.parse(JSON.stringify(obj));(function walk(o){if(o&&typeof o==='object'){if('id' in o)o.id=uid();Object.values(o).forEach(walk);}})(c);return c;}

function freshState(){
  state={name:'',subject:'',preheader:'',styles:{...DEFAULT_STYLES},sections:[]};
  const s1=makeSection([100]);s1.padTop=12;s1.padBottom=4;
  const s2=makeSection([50,50]);s2.padTop=4;s2.padBottom=12;
  state.sections.push(s1,s2);
  return state;
}

function findModule(id){for(const s of state.sections)for(const c of s.columns){const i=c.modules.findIndex(m=>m.id===id);if(i>-1)return {s,c,i,m:c.modules[i]};}return null;}
function findSection(id){const i=state.sections.findIndex(s=>s.id===id);return i>-1?{s:state.sections[i],i}:null;}
function findColumn(id){for(const s of state.sections){const c=s.columns.find(c=>c.id===id);if(c)return c;}return null;}
function sectionOf(selObj){if(!selObj)return null;if(selObj.kind==='section')return findSection(selObj.id);const f=findModule(selObj.id);return f?findSection(f.s.id):null;}

/* ---------- History ---------- */
function pushHistory(){undoStack.push(JSON.stringify(state));if(undoStack.length>120)undoStack.shift();redoStack=[];lastPush=Date.now();updateUndo();}
function checkpoint(){if(Date.now()-lastPush>800)pushHistory();else lastPush=Date.now();}
function mutate(fn){pushHistory();const r=fn();markDirty();renderCanvas();renderSidebar();return r;}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify(state));state=JSON.parse(undoStack.pop());afterRestore();}
function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify(state));state=JSON.parse(redoStack.pop());afterRestore();}
function afterRestore(){validateSel();markDirty();renderAll();}
function validateSel(){const ok=s=>s&&(s.kind==='module'?!!findModule(s.id):!!findSection(s.id));if(!ok(sel))sel=null;if(!ok(lastSel))lastSel=null;}
function updateUndo(){$('#undoBtn').disabled=!undoStack.length;$('#redoBtn').disabled=!redoStack.length;}
function markDirty(){dirty=true;updateStatus();}
function updateStatus(){
  const st=$('#status');st.classList.toggle('dirty',dirty);
  const t=savedAt?new Date(savedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'';
  st.innerHTML=`<span class="dot"></span>${dirty?'Draft · Unsaved changes':(savedAt?'Saved at '+t:'Draft · No changes yet')}`;
}

function linkify(html){return html.replace(/<a\s(?![^>]*style=)/gi,`<a style="color:${state.styles.link};text-decoration:underline;" `);}
function textBlockCss(p,S){
  const ts=p.textStyles||{};
  const weight=ts.bold?Math.max(700,Number(p.fontWeight)||400):(Number(p.fontWeight)||400);
  const deco=[ts.underline&&'underline',ts.strike&&'line-through'].filter(Boolean);
  let size=Number(p.fontSize)||14,va='baseline';
  if(ts.sub||ts.sup){size=Math.max(10,Math.round(size*.75));va=ts.sup?'super':'sub';}
  const ls=(p.letterSpacing==null||Number(p.letterSpacing)===0)?'normal':`${p.letterSpacing}${p.letterSpacingUnit||'px'}`;
  return `margin:0;font-family:${p.fontFamily||S.font};font-size:${size}px;font-weight:${weight};font-style:${ts.italic?'italic':'normal'};line-height:${p.lineHeight||1.5};letter-spacing:${ls};text-align:${p.textAlign||'left'};text-transform:${p.textTransform||'none'};text-decoration:${deco.length?deco.join(' '):'none'};vertical-align:${va};color:${p.color||S.text||'#333333'};`;
}
function applyParagraphDefaults(props,style){
  const d=PARA_DEFAULTS[style]||PARA_DEFAULTS.p;

  props.fontWeight=d.fontWeight;
}

        (p.company?`<div style="font-weight:bold;">${esc(p.company)}</div>`:'')+
        (p.address?`<div>${esc(p.address).replace(/\n/g,'<br>')}</div>`:'')+
        (p.reason?`<div style="margin-top:8px;">${esc(p.reason)}</div>`:'')+
        `<div style="margin-top:8px;"><a href="{{UnsubscribeLink}}" style="${ls}">${esc(p.unsub)}</a>${p.prefs?` &nbsp;·&nbsp; <a href="{{PreferencesLink}}" style="${ls}">${esc(p.prefs)}</a>`:''}</div></div>`;
    }
  }
  return '';
}

function buildEmail(mode){
  const S=state.styles;
  const rows=state.sections.map(s=>{
    const cols=s.columns.map((c,i)=>`<td class="${s.stack?'stack-col':''}" width="${Math.round(s.layout[i])}%" valign="top" style="width:${s.layout[i]}%;vertical-align:top;">${c.modules.map(m=>modHTML(m,mode)).join('')||'&nbsp;'}</td>`).join('');
    return `<tr><td style="background:${s.bg||S.body};padding:${s.padTop}px 0 ${s.padBottom}px 0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr>${cols}</tr></table></td></tr>`;

<table role="presentation" class="container" width="${S.width}" cellpadding="0" cellspacing="0" border="0" style="width:${S.width}px;max-width:${S.width}px;background:${S.body};font-family:${S.font};color:${S.text};border-collapse:collapse;">
${rows}
</table></td></tr></table>`;
}
function exportHTML(){

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">

body{margin:0;padding:0;}img{border:0;outline:none;text-decoration:none;}a{color:${S.link};}

function renderCanvas(){

function rerenderModule(id){

function wireImgs(root){

const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent||'';};
function updateCount(){

/* ---------- Selection ---------- */
function setSelection(s){

/* ---------- Structural actions ---------- */
function defaultSectionIndex(){
  const n=state.sections.length;
  if(n&&state.sections[n-1].columns.some(c=>c.modules.some(m=>m.type==='footer')))return n-1;
  return n;
}
function insertIndexForSection(){const f=sectionOf(lastSel);return f?f.i+1:defaultSectionIndex();}
function quickAdd(type){
  const m=makeModule(type);
  mutate(()=>{
    const a=lastSel;
    if(a&&a.kind==='module'){const f=findModule(a.id);if(f){f.c.modules.splice(f.i+1,0,m);sel=lastSel={kind:'module',id:m.id};return;}}
    if(a&&a.kind==='section'){const f=findSection(a.id);if(f){f.s.columns[0].modules.push(m);sel=lastSel={kind:'module',id:m.id};return;}}
    const s=makeSection([100]);s.columns[0].modules.push(m);state.sections.splice(defaultSectionIndex(),0,s);sel=lastSel={kind:'module',id:m.id};
  });
  reveal(m.id);toast(`${MODS[type].label} added`);
}
function quickSection(s){
  mutate(()=>{state.sections.splice(insertIndexForSection(),0,s);sel=lastSel={kind:'section',id:s.id};});
  reveal(s.id);
}
function moveMod(id,dir){
  const f=findModule(id);if(!f)return;
  const j=f.i+dir,si=state.sections.indexOf(f.s)+dir;
  const within=j>=0&&j<f.c.modules.length;
  if(!within&&(si<0||si>=state.sections.length))return;
  mutate(()=>{
    if(within){const [m]=f.c.modules.splice(f.i,1);f.c.modules.splice(j,0,m);}
    else{const ts=state.sections[si];const ci=Math.min(f.s.columns.indexOf(f.c),ts.columns.length-1);const tc=ts.columns[ci];f.c.modules.splice(f.i,1);dir<0?tc.modules.push(f.m):tc.modules.unshift(f.m);}
    sel=lastSel={kind:'module',id};
  });
}
function dupMod(id){const f=findModule(id);if(!f)return;const c=cloneWithIds(f.m);mutate(()=>{f.c.modules.splice(f.i+1,0,c);sel=lastSel={kind:'module',id:c.id};});reveal(c.id);}
function delMod(id){const f=findModule(id);if(!f)return;const label=MODS[f.m.type].label;mutate(()=>{f.c.modules.splice(f.i,1);if(sel&&sel.id===id)sel=null;if(lastSel&&lastSel.id===id)lastSel=null;});toast(`${label} block deleted`,{undo:true});}
function moveSec(id,dir){const f=findSection(id);if(!f)return;const j=f.i+dir;if(j<0||j>=state.sections.length)return;mutate(()=>{const [s]=state.sections.splice(f.i,1);state.sections.splice(j,0,s);});reveal(id);}
function dupSec(id){const f=findSection(id);if(!f)return;const c=cloneWithIds(f.s);mutate(()=>{state.sections.splice(f.i+1,0,c);sel=lastSel={kind:'section',id:c.id};});reveal(c.id);}
function delSec(id){const f=findSection(id);if(!f)return;mutate(()=>{state.sections.splice(f.i,1);sel=null;if(lastSel&&(lastSel.id===id||!findModule(lastSel.id)&&!findSection(lastSel.id)))lastSel=null;});toast('Section deleted',{undo:true});}
function setLayout(s,cols){
  const n=cols.length;
  while(s.columns.length<n)s.columns.push({id:uid(),modules:[]});
  if(s.columns.length>n){const extra=s.columns.splice(n);extra.forEach(c=>s.columns[n-1].modules.push(...c.modules));}
  s.layout=[...cols];
}

/* ---------- Canvas events ---------- */
emailEl.addEventListener('click',e=>{
  if(e.target.closest('a'))e.preventDefault();
  const act=e.target.closest('[data-act]');
  if(act){e.stopPropagation();handleAct(act.dataset.act,act);return;}
  const mod=e.target.closest('.mod');
  if(mod){if(!sel||sel.id!==mod.dataset.mod)setSelection({kind:'module',id:mod.dataset.mod});return;}
  const sec=e.target.closest('.sec');
  if(sec)setSelection({kind:'section',id:sec.dataset.sec});
});
wrapEl.addEventListener('click',e=>{if(!e.target.closest('#email')&&sel){lastSel=null;setSelection(null);}});
function handleAct(act,btn){
  const modId=btn.closest('.mod')?.dataset.mod,secId=btn.closest('.sec')?.dataset.sec;
  switch(act){
    case 'mod-up':moveMod(modId,-1);break;
    case 'mod-down':moveMod(modId,1);break;
    case 'mod-dup':dupMod(modId);break;
    case 'mod-del':delMod(modId);break;
    case 'sec-edit':setSelection({kind:'section',id:secId});break;
    case 'sec-up':moveSec(secId,-1);break;
    case 'sec-down':moveSec(secId,1);break;
    case 'sec-dup':dupSec(secId);break;
    case 'sec-del':delSec(secId);break;
    case 'img-upload':{
      const f=findModule(modId);if(!f)return;
      setSelection({kind:'module',id:modId});
      pickImage(src=>mutate(()=>{f.m.props[f.m.type==='video'?'thumb':'src']=src;sel=lastSel={kind:'module',id:modId};}));
    }
  }
}
emailEl.addEventListener('focusin',e=>{
  const ed=e.target.closest&&e.target.closest('.rt');if(!ed)return;

emailEl.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('rt')){textSession=false;setTimeout(updateToolbar,0);}});
emailEl.addEventListener('input',e=>{

emailEl.addEventListener('paste',e=>{

function syncText(ed){const id=ed.closest('.mod')?.dataset.mod;const f=findModule(id);if(!f)return;f.m.props.html=ed.innerHTML;markDirty();updateCount();}

/* ---------- Drag and drop ---------- */
const DT='application/x-email-builder';
function startDrag(e,payload,effect){
  drag=payload;e.dataTransfer.effectAllowed=effect;
  try{e.dataTransfer.setData(DT,'1');}catch(_){}
  document.body.classList.add('is-dragging');
}
function endDrag(){drag=null;curTarget=null;hideIndicator();document.body.classList.remove('is-dragging');$$('.mod.is-moving').forEach(m=>m.classList.remove('is-moving'));}
emailEl.addEventListener('dragstart',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]');
  if(!g){if(e.target.tagName==='IMG')e.preventDefault();return;}
  const mod=g.closest('.mod');
  startDrag(e,{kind:'move',id:mod.dataset.mod},'move');
  try{e.dataTransfer.setDragImage(mod,24,16);}catch(_){}
  requestAnimationFrame(()=>mod.classList.add('is-moving'));
});
emailEl.addEventListener('dragend',endDrag);
function gapIndex(y){let i=0;for(const s of $$('.sec',emailEl)){const r=s.getBoundingClientRect();if(y>r.top+r.height/2)i++;}return i;}
function computeTarget(e){
  const x=e.clientX,y=e.clientY;
  if(drag.kind==='layout'||drag.kind==='preset')return {kind:'gap',index:gapIndex(y)};
  let col=e.target.closest&&e.target.closest('.col');
  if(!col){const sec=e.target.closest&&e.target.closest('.sec');if(sec){const cols=$$('.col',sec);col=cols.find(c=>{const r=c.getBoundingClientRect();return x>=r.left&&x<=r.right;})||cols[cols.length-1];}}
  if(col){
    const mods=[...col.children].filter(c=>c.classList.contains('mod'));let idx=mods.length;
    for(let i=0;i<mods.length;i++){const r=mods[i].getBoundingClientRect();if(y<r.top+r.height/2){idx=i;break;}}
    return {kind:'col',col:col.dataset.col,index:idx,el:col,mods};
  }
  return {kind:'gap',index:gapIndex(y)};
}
function hideIndicator(){$('#dropLine').hidden=true;$$('.col.drop-hot').forEach(c=>c.classList.remove('drop-hot'));}
function showIndicator(t){
  const line=$('#dropLine'),wr=wrapEl.getBoundingClientRect();
  $$('.col.drop-hot').forEach(c=>c.classList.remove('drop-hot'));
  let left,top,width;
  if(t.kind==='col'){
    if(!t.mods.length){t.el.classList.add('drop-hot');line.hidden=true;return;}
    const cr=t.el.getBoundingClientRect();
    top=t.index<t.mods.length?t.mods[t.index].getBoundingClientRect().top:t.mods[t.mods.length-1].getBoundingClientRect().bottom;
    left=cr.left;width=cr.width;line.classList.remove('gap');
  }else{
    const er=emailEl.getBoundingClientRect(),secs=$$('.sec',emailEl);
    top=!secs.length?er.top+er.height/2:(t.index<secs.length?secs[t.index].getBoundingClientRect().top:secs[secs.length-1].getBoundingClientRect().bottom);
    left=er.left;width=er.width;line.classList.add('gap');
  }
  line.style.left=(left-wr.left)+'px';line.style.top=(top-wr.top-1)+'px';line.style.width=width+'px';line.hidden=false;
}
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
const fileMod=e=>e.target.closest&&e.target.closest('.mod[data-type="image"],.mod[data-type="video"]');
function clearFileHot(){$$('.mod.file-hot').forEach(m=>m.classList.remove('file-hot'));}
wrapEl.addEventListener('dragover',e=>{
  if(drag){e.preventDefault();e.dataTransfer.dropEffect=drag.kind==='move'?'move':'copy';curTarget=computeTarget(e);showIndicator(curTarget);return;}
  if(hasFiles(e)){clearFileHot();const m=fileMod(e);if(m){e.preventDefault();e.dataTransfer.dropEffect='copy';m.classList.add('file-hot');}}
});
wrapEl.addEventListener('dragleave',e=>{if(!wrapEl.contains(e.relatedTarget)){hideIndicator();clearFileHot();}});
wrapEl.addEventListener('drop',e=>{
  if(drag){e.preventDefault();const t=curTarget||computeTarget(e);const d=drag;endDrag();doDrop(d,t);return;}
  if(hasFiles(e)){
    e.preventDefault();const m=fileMod(e);clearFileHot();const file=e.dataTransfer.files[0];
    if(m&&file)readImage(file,src=>{const f=findModule(m.dataset.mod);if(!f)return;mutate(()=>{f.m.props[f.m.type==='video'?'thumb':'src']=src;sel=lastSel={kind:'module',id:f.m.id};});});
    else toast('Drop image files onto an Image or Video block.');
  }
});
document.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault();});
document.addEventListener('drop',e=>{if(hasFiles(e))e.preventDefault();});
function placeModule(m,t){
  if(t.kind==='col'){const c=findColumn(t.col);if(c){c.modules.splice(t.index,0,m);return;}}
  const s=makeSection([100]);s.columns[0].modules.push(m);state.sections.splice(t.kind==='gap'?t.index:state.sections.length,0,s);
}
function doDrop(d,t){
  if(d.kind==='layout'||d.kind==='preset'){
    const s=d.kind==='layout'?makeSection(d.cols):PRESETS[d.key].make();
    mutate(()=>{state.sections.splice(t.index,0,s);sel=lastSel={kind:'section',id:s.id};});
    reveal(s.id);renderPropsPanel();
  }else if(d.kind==='new'){
    const m=makeModule(d.type);
    mutate(()=>{placeModule(m,t);sel=lastSel={kind:'module',id:m.id};});
    reveal(m.id);renderPropsPanel();
  }else if(d.kind==='move'){
    const f=findModule(d.id);if(!f)return;
    if(t.kind==='col'&&t.col===f.c.id&&(t.index===f.i||t.index===f.i+1))return;
    mutate(()=>{
      f.c.modules.splice(f.i,1);
      let idx=t.index;if(t.kind==='col'&&t.col===f.c.id&&f.i<idx)idx--;
      placeModule(f.m,{...t,index:idx});sel=lastSel={kind:'module',id:f.m.id};
    });
    reveal(f.m.id);renderPropsPanel();
  }
}

/* ---------- Sidebar (left) + Properties (right) ---------- */
const side=$('#side');
const props=$('#props');

  if(!side.querySelector('[data-tab]')) renderTabs();

}
function renderPropsPanel(){
  if(sel&&sel.kind==='module'){const f=findModule(sel.id);if(f)return renderModulePanel(f);sel=null;}
  if(sel&&sel.kind==='section'){const f=findSection(sel.id);if(f)return renderSectionPanel(f);sel=null;}

}
function renderPropsEmpty(){

}
function renderTabs(){

  const notes={content:'Drag a block onto the canvas. After you drop it, its properties open on the right.',layout:'Drag a layout between sections, or click to add it. Empty columns accept any content block.',design:'These styles apply to the whole email. Individual blocks can override them on the right.'};
  side.innerHTML=`<div class="side-head"><div class="eyebrow">Add to email</div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button type="button" class="tab" role="tab" id="tab-${k}" aria-selected="${leftTab===k}" aria-controls="pane" data-tab="${k}">${l}</button>`).join('')}</div></div>
    <div class="side-scroll"><div class="pane" id="pane" role="tabpanel" aria-labelledby="tab-${leftTab}">${paneHTML()}</div></div>

  if(leftTab==='content'){

      toast('Brand color applied to buttons, job cards and social icons');

function tilesHTML(){
  const q=modQuery.trim().toLowerCase();
  const list=MOD_ORDER.filter(k=>!q||MODS[k].label.toLowerCase().includes(q));
  if(!list.length)return `<div class="tiles-empty">No blocks match “${esc(modQuery)}”.</div>`;
  return list.map(k=>`<div class="tile" role="button" tabindex="0" draggable="true" data-add="${k}" aria-label="Add ${MODS[k].label}">${ic(MODS[k].icon,20)}<span>${MODS[k].label}</span></div>`).join('');
}
function layDiag(cols){return `<span class="lay-d">${cols.map(c=>`<i style="flex:${c}"></i>`).join('')}</span>`;}
function paneHTML(){

function openLinkPop(anchor,ed){

function stateFromHostTemplate(tpl){
  if(tpl&&tpl.editorState&&Array.isArray(tpl.editorState.sections)){
    state=JSON.parse(JSON.stringify(tpl.editorState));

  state.preheader=tpl&&tpl.preheader?String(tpl.preheader):'';

  state.sections=[];

    ?paras.map(p=>escHtmlText(p)).join('<br><br>')

  undoStack=[];redoStack=[];sel=null;lastSel=null;dirty=false;stageTab='edit';

  if(isEdit)stateFromHostTemplate(msg.template);

  const parts=[];
  state.sections.forEach(s=>s.columns.forEach(c=>c.modules.forEach(m=>{
    if(m.type==='text'){const t=plain(m.props.html||'').trim();if(t)parts.push(t);}
    else if(m.type==='button'&&m.props.label)parts.push(m.props.label);
    else if(m.type==='job'){const bits=[m.props.title,m.props.summary].filter(Boolean).map(String);if(bits.length)parts.push(bits.join(' — '));}
  })));

function save(){
  if(!state.name.trim()){
    setErr('tplName','Give the template a name so recruiters can find it.');
    toast('Name your template before saving.');
    return;
  }
  const hasContent=state.sections.some(s=>s.columns.some(c=>c.modules.length));
  if(!hasContent){
    setStageTab('edit');
    toast('Add at least one content block to the email before saving.');
    return;
  }
  if(!inboxSettingsReady()){
    setStageTab('inbox');
    showInboxSetupBanner(true);
    if(!state.subject.trim())setErr('subject','Add a subject line before saving.');
    if(!state.preheader.trim())setErr('preheader','Add preview text before saving.');
    ($('#subject').value?$('#preheader'):$('#subject')).focus();
    toast('Setup the Inbox Settings before saving.');
    return;
  }
  showInboxSetupBanner(false);
  clearErr('subject');clearErr('preheader');
  savedJSON=JSON.stringify(state);savedAt=Date.now();dirty=false;
  let stored=true;try{localStorage.setItem(KEY,JSON.stringify({state,savedAt}));}catch(_){stored=false;}
  updateStatus();

  if(IN_APP){
    postToApp({type:'save',template:{
      name:state.name.trim(),
      subject:state.subject.trim(),
      preheader:state.preheader||'',
      body:extractBodyParts(),
      html:exportHTML(),
      editorState:JSON.parse(JSON.stringify(state)),
    }});
    return;
  }
  toast(!stored?'Template saved for this session. Your browser blocked storage, so it will reset on reload.':hasFooter?'Template saved':'Template saved. Add a Footer block with an unsubscribe link before sending.');
}

  if(e.key==='Escape'){
    if(!pop.hidden){closePop();return;}
    if(modalOpen){closeModal();return;}
    if(sel){if(typing)ae.blur();setSelection(null);}
    return;
  }
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();save();return;}
  if(typing||modalOpen)return;
  const k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(mod&&k==='y'){e.preventDefault();redo();}
  else if(mod&&k==='d'&&sel){e.preventDefault();sel.kind==='module'?dupMod(sel.id):dupSec(sel.id);}
  else if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();sel.kind==='module'?delMod(sel.id):delSec(sel.id);}
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();}});

/* ---------- Boot ---------- */
function renderAll(){
  TOP.forEach(([id,k])=>{const el=$('#'+id);if(el.value!==state[k])el.value=state[k];});
  syncTplNameDisplay();
  setStageTab(stageTab);
  renderCanvas();renderSidebar();updateUndo();updateStatus();updateInbox();updateToolbar();
}
try{document.execCommand('styleWithCSS',false,true);}catch(_){}
let restored=false;
const wantFresh=/[?&]fresh=1(?:&|$)/.test(location.search);
if(!wantFresh&&!IN_APP){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.state&&Array.isArray(d.state.sections)){state=d.state;state.styles={...DEFAULT_STYLES,...(state.styles||{})};savedAt=d.savedAt||null;restored=true;}}}catch(_){}
}
if(!restored)freshState();
savedJSON=JSON.stringify(state);
renderAll();
if(IN_APP)postToApp({type:'ready'});
})();
</script>
